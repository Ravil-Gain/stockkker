<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="100" xmlns="http://www.w3.org/2000/svg">
    <!-- Основная синяя линия с характерным подъёмом под буквой A -->
    <path 
        d="M 40 60
           Q 120 60, 160 55
           Q 180 45, 200 55
           Q 240 65, 280 60" 
        stroke="#009FE3" 
        stroke-width="6" 
        fill="none"
        stroke-linecap="round"
    />
    
    <!-- Два характерных штриха справа -->
    <path 
        d="M 290 58
           L 340 58" 
        stroke="#009FE3" 
        stroke-width="5"
        stroke-linecap="round"
    />
    
    <path 
        d="M 300 65
           L 350 65" 
        stroke="#009FE3" 
        stroke-width="5"
        stroke-linecap="round"
    />
</svg>
